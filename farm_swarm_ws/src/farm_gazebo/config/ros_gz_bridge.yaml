- ros_topic_name: "/robot2/joint_states"
  gz_topic_name: "/robot2/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# 側方RGBDカメラ
- ros_topic_name: "/robot2/rgbd/robot2_side/image"
  gz_topic_name: "/robot2/rgbd/robot2_side/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/rgbd/robot2_side/depth_image"
  gz_topic_name: "/robot2/rgbd/robot2_side/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/rgbd/robot2_side/points"
  gz_topic_name: "/robot2/rgbd/robot2_side/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# ===================== Robot 3 (Collector) =====================

- ros_topic_name: "/robot3/cmd_vel"
  gz_topic_name: "/robot3/cmd_vel"
